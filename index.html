<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Examer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-1" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-2" aria-hidden="true"></div>
    <main class="app">
      <header class="app-header">
        <h1>Simple Examer</h1>
        <p>Luyện đề trắc nghiệm từ file TXT, làm bài 40 phút/đề.</p>
      </header>
      <section id="home-view" class="card">
        <h2>Chọn đề thi</h2>
        <p class="muted">
          Đề 1-4.2: đủ 40 câu, ngẫu nhiên thứ tự. Final: 50 câu (mỗi đề 10 câu).
        </p>
        <div id="exam-buttons" class="exam-grid"></div>
        <p id="loading-status" class="muted">Đang tải ngân hàng câu hỏi...</p>
      </section>
      <section id="exam-view" class="card hidden">
        <div class="exam-top">
          <div>
            <h2 id="exam-title">Đề thi</h2>
            <p id="exam-subtitle" class="muted"></p>
          </div>
          <div class="timer-box">
            <span>Thời gian còn lại</span><strong id="timer">40:00</strong>
          </div>
        </div>
        <form id="exam-form" class="question-list"></form>
        <div class="actions">
          <button id="submit-btn" type="button" class="btn btn-primary">
            Nộp bài</button
          ><button id="back-btn" type="button" class="btn btn-ghost">
            Về trang chọn đề
          </button>
        </div>
      </section>
      <section id="result-view" class="card hidden">
        <h2>Kết quả</h2>
        <p id="result-summary"></p>
        <div id="result-details" class="result-list"></div>
        <div class="actions">
          <button id="retry-btn" type="button" class="btn btn-primary">
            Làm lại đề này</button
          ><button id="home-btn" type="button" class="btn btn-ghost">
            Chọn đề khác
          </button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
