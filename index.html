<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Practice Engine - QA Certification</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Selector Page -->
      <div id="selectorPage" class="page active">
        <header class="header">
          <h1>📚 Exam Practice Engine</h1>
          <p>Master QA Concepts & Practice Exams</p>
        </header>

        <div class="selector-container">
          <h2>Select an Exam</h2>
          <div id="examList" class="exam-grid">
            <!-- Dynamically populated -->
          </div>

          <div class="action-buttons">
            <button id="practiceWeakBtn" class="btn btn-secondary">
              📋 Practice Weak Questions
            </button>
          </div>

          <div class="history-section">
            <h3>Recent Scores</h3>
            <div id="scoreHistory" class="score-history">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>
      </div>

      <!-- Exam Page -->
      <div id="examPage" class="page">
        <header class="exam-header">
          <div class="header-top">
            <h1 id="examTitleDisplay"></h1>
            <button id="backBtn" class="btn btn-small">← Back</button>
          </div>
          <div class="timer-container">
            <div id="timer" class="timer">60:00</div>
            <span id="questionCount" class="question-count"></span>
          </div>
        </header>

        <div class="exam-container">
          <div id="questionsContainer" class="questions-grid">
            <!-- Dynamically populated -->
          </div>

          <div class="submit-section">
            <button id="submitBtn" class="btn btn-primary">Submit Exam</button>
          </div>
        </div>
      </div>

      <!-- Results Page -->
      <div id="resultsPage" class="page">
        <header class="results-header">
          <h1>📊 Exam Results</h1>
        </header>

        <div class="results-container">
          <div class="results-summary">
            <div class="score-card">
              <div class="score-value" id="totalScore">0/50</div>
              <div class="score-label">Total Score</div>
            </div>

            <div class="stats-grid">
              <div class="stat-box">
                <div class="stat-value" id="correctCount">0</div>
                <div class="stat-label">Correct</div>
              </div>
              <div class="stat-box">
                <div class="stat-value" id="wrongCount">0</div>
                <div class="stat-label">Wrong</div>
              </div>
              <div class="stat-box">
                <div class="stat-value" id="percentage">0%</div>
                <div class="stat-label">Percentage</div>
              </div>
            </div>
          </div>

          <div id="resultsFeedback" class="results-feedback">
            <!-- Dynamically populated with answer review -->
          </div>

          <div class="results-actions">
            <button id="retakeBtn" class="btn btn-primary">
              🔄 Retake Exam
            </button>
            <button id="backToSelectorBtn" class="btn btn-secondary">
              Back to Exams
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
